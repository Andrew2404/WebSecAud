name: Validate audit package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate catalog and reproducible offline HTML
        run: python3 scripts/validate_package.py
      - name: Exercise import and release-gate logic
        run: node scripts/test_workbook.cjs
      - name: Validate draft ledger and safety invariants
        run: |
          python3 scripts/validate_ledger.py templates/test-plan-ledger.json
          python3 scripts/validate_ledger.py examples/ledger-dry-run.json
          python3 scripts/test_ledger.py
